[project]
name = "deepseek-v4-flash-dgx-spark"
version = "0.1.0"
description = "DGX Spark runtime experiments and serving harness for DeepSeek-V4-Flash."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "pydantic>=2.0",
  "safetensors>=0.7",
  "transformers>=4.57",
  "uvicorn[standard]>=0.30",
]

[project.scripts]
deepseek-spark-serve = "spark_runtime.server:main"
deepseek-spark-probe = "spark_runtime.cli:main"

[dependency-groups]
dev = [
  "httpx>=0.28",
  "pytest>=8",
  "ruff>=0.8",
]

[tool.uv]
package = true

[tool.setuptools]
packages = ["spark_runtime"]

[tool.setuptools.package-data]
spark_runtime = ["native/*.cpp"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
